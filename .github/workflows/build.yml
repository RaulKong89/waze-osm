name: Build Waze OSM IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install ldid
      run: brew install ldid
        
    - name: Download iOS 6.1 SDK
      run: |
        mkdir -p /tmp/sdk
        curl -L -o /tmp/sdk/iPhoneOS6.1.sdk.zip "https://github.com/growtopiajaw/iPhoneOS-SDK/releases/download/v1.0/iPhoneOS6.1.sdk.zip"
        unzip -q /tmp/sdk/iPhoneOS6.1.sdk.zip -d /tmp/sdk/
        ls -la /tmp/sdk/
        
    - name: Build dylib with clang
      working-directory: waze-osm-tweak
      run: |
        SDK=/tmp/sdk/iPhoneOS6.1.sdk
        
        # Compile
        clang -arch armv7 \
          -isysroot $SDK \
          -miphoneos-version-min=6.0 \
          -fno-objc-arc \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework CoreLocation \
          -dynamiclib \
          -install_name @executable_path/WazeOSM.dylib \
          -o WazeOSM.dylib \
          Tweak.xm 2>&1
        
        ls -la WazeOSM.dylib
        file WazeOSM.dylib
        
    - name: Download Waze IPA
      run: |
        curl -L -o waze.ipa "https://archive.org/download/waze_3.9.6_ios_6.0/waze_3.9.6.ipa"
        ls -la waze.ipa
        
    - name: Inject dylib into IPA
      run: |
        python3 waze-osm-tweak/inject_dylib.py waze.ipa waze-osm-tweak/WazeOSM.dylib -o Waze-OSM-3.9.6.ipa
        ls -la Waze-OSM-3.9.6.ipa
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Waze-OSM-3.9.6.ipa
        path: Waze-OSM-3.9.6.ipa
        
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Waze OSM v${{ github.run_number }}
        body: "Waze 3.9.6 with OpenStreetMap. iOS 6+ compatible. Jailbreak required."
        files: Waze-OSM-3.9.6.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
