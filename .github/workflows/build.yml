name: Build Waze OSM IPA with TLSFix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install ldid
      run: brew install ldid
        
    - name: Download iOS 6.1 SDK
      run: |
        mkdir -p /tmp/sdk
        curl -L -o /tmp/sdk/iPhoneOS6.1.sdk.zip "https://github.com/growtopiajaw/iPhoneOS-SDK/releases/download/v1.0/iPhoneOS6.1.sdk.zip"
        unzip -q /tmp/sdk/iPhoneOS6.1.sdk.zip -d /tmp/sdk/
        
    - name: Clone TLSFix
      run: |
        cd /tmp
        git clone --depth 1 https://github.com/nfzerox/TLSFix.git
        ls TLSFix/
        
    - name: Build TLSFix dylib
      run: |
        cd /tmp/TLSFix
        # Build using Theos-style compilation
        SDK=/tmp/sdk/iPhoneOS6.1.sdk
        
        # Compile the engine
        clang -arch armv7 \
          -isysroot $SDK \
          -miphoneos-version-min=6.0 \
          -c src/tlsfix_engine.c \
          -o /tmp/tlsfix_engine.o
          
        # Compile the hooks
        clang -arch armv7 \
          -isysroot $SDK \
          -miphoneos-version-min=6.0 \
          -c src/tlsfix_hooks.c \
          -o /tmp/tlsfix_hooks.o
          
        # Link into dylib
        clang -arch armv7 \
          -isysroot $SDK \
          -miphoneos-version-min=6.0 \
          -dynamiclib \
          -install_name /Library/MobileSubstrate/DynamicLibraries/TLSFix.dylib \
          -o /tmp/TLSFix.dylib \
          /tmp/tlsfix_engine.o /tmp/tlsfix_hooks.o \
          -framework Foundation -framework Security -framework CoreFoundation
          
        ls -la /tmp/TLSFix.dylib
        file /tmp/TLSFix.dylib
        
    - name: Build WazeOSM dylib
      working-directory: waze-osm-tweak
      run: |
        SDK=/tmp/sdk/iPhoneOS6.1.sdk
        
        # Compile
        clang -arch armv7 \
          -isysroot $SDK \
          -miphoneos-version-min=6.0 \
          -fno-objc-arc \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework CoreLocation \
          -dynamiclib \
          -install_name @executable_path/WazeOSM.dylib \
          -o WazeOSM.dylib \
          Tweak.xm 2>&1
          
        ls -la WazeOSM.dylib
        file WazeOSM.dylib
        
    - name: Download Waze IPA
      run: |
        curl -L -o waze.ipa "https://github.com/RaulKong89/waze-osm/releases/download/v0.1.0/waze_3.9.6.ipa"
        ls -la waze.ipa
        
    - name: Inject dylibs into IPA
      run: |
        python3 waze-osm-tweak/inject_dylib.py waze.ipa waze-osm-tweak/WazeOSM.dylib -o Waze-OSM-3.9.6.ipa
        python3 waze-osm-tweak/inject_dylib.py Waze-OSM-3.9.6.ipa /tmp/TLSFix.dylib -o Waze-OSM-TLS-3.9.6.ipa
        ls -la Waze-OSM-TLS-3.9.6.ipa
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Waze-OSM-TLS-3.9.6.ipa
        path: Waze-OSM-TLS-3.9.6.ipa
        
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Waze OSM TLS v${{ github.run_number }}
        body: "Waze 3.9.6 cu OpenStreetMap tiles + TLSFix pentru iOS 6+. Jailbreak required."
        files: Waze-OSM-TLS-3.9.6.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
