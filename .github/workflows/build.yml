name: Build & Release Waze OSM IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        brew install ldid git
        
    - name: Clone Theos
      run: |
        rm -rf $HOME/theos
        git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        
    - name: Install vendor headers
      run: |
        git clone --depth 1 https://github.com/theos/vendor.git /tmp/theos-vendor
        cp -r /tmp/theos-vendor $HOME/theos/vendor
        ls $HOME/theos/vendor/ | head -5
        
    - name: Download iOS 6.1 SDK
      run: |
        mkdir -p $HOME/theos/sdks
        cd $HOME/theos/sdks
        curl -L -o iPhoneOS6.1.sdk.zip "https://github.com/growtopiajaw/iPhoneOS-SDK/releases/download/v1.0/iPhoneOS6.1.sdk.zip"
        unzip -q iPhoneOS6.1.sdk.zip
        ls -la
        
    - name: Create Makefile
      working-directory: waze-osm-tweak
      run: |
        python3 << 'PYEOF'
        import os
        home = os.environ.get('HOME', '/Users/runner')
        with open('Makefile', 'w') as f:
            f.write(f'THEOS = {home}/theos\n')
            f.write('SDK_VERSION = 6.1\n')
            f.write('ARCHS = armv7\n')
            f.write('TARGET = iphone:clang:6.1:6.1\n')
            f.write('include $(THEOS)/makefiles/common.mk\n')
            f.write('TWEAK_NAME = WazeOSM\n')
            f.write('WazeOSM_FILES = Tweak.xm\n')
            f.write('WazeOSM_FRAMEWORKS = Foundation UIKit CoreGraphics CoreLocation\n')
            f.write('include $(THEOS)/makefiles/tweak.mk\n')
        print("Makefile created")
        print(open('Makefile').read())
        PYEOF
        
    - name: Build WazeOSM dylib
      working-directory: waze-osm-tweak
      run: |
        export THEOS=$HOME/theos
        make clean
        make
        
    - name: Verify dylib
      run: |
        ls -la waze-osm-tweak/.theos/obj/debug/armv7/
        file waze-osm-tweak/.theos/obj/debug/armv7/WazeOSM.dylib
        
    - name: Download Waze IPA
      run: |
        curl -L -o waze.ipa "https://archive.org/download/waze_3.9.6_ios_6.0/waze_3.9.6.ipa"
        
    - name: Inject dylib into IPA
      run: |
        python3 waze-osm-tweak/inject_dylib.py waze.ipa waze-osm-tweak/.theos/obj/debug/armv7/WazeOSM.dylib -o Waze-OSM-3.9.6.ipa
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Waze-OSM-3.9.6.ipa
        path: Waze-OSM-3.9.6.ipa
        
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Waze OSM v${{ github.run_number }}
        body: "Waze 3.9.6 with OpenStreetMap tiles. iOS 6+ compatible. Requires jailbreak with Cydia Substrate."
        files: Waze-OSM-3.9.6.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
