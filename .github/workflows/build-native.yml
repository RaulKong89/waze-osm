    - name: Compile
      working-directory: waze-osm-native
      run: |
        SDK=/tmp/sdk/iPhoneOS6.1.sdk
        INC="-I Classes -I $SDK/usr/include"
        CC="clang -arch armv7 -isysroot $SDK -miphoneos-version-min=6.0 $INC"
        
        $CC -fno-objc-arc -c main.m -o /tmp/main.o 2>&1
        $CC -fno-objc-arc -c Classes/WazeAppDelegate.m -o /tmp/WazeAppDelegate.o 2>&1
        $CC -fno-objc-arc -c Classes/WazeMapViewController.m -o /tmp/WazeMapViewController.o 2>&1
        $CC -fno-objc-arc -c Classes/WazeOSMServerClient.m -o /tmp/WazeOSMServerClient.o 2>&1
        
        ld -arch armv7 -syslibroot $SDK -L$SDK/usr/lib -framework Foundation -framework UIKit -framework MapKit -framework CoreLocation -framework CoreGraphics -framework CFNetwork -lSystem -o /tmp/WazeOSM /tmp/main.o /tmp/WazeAppDelegate.o /tmp/WazeMapViewController.o /tmp/WazeOSMServerClient.o 2>&1
        
        file /tmp/WazeOSM
