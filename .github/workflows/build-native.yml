name: Build WazeOSM Native IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Theos
      run: |
        git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        
    - name: Install ldid
      run: brew install ldid
        
    - name: Download iOS 6.1 SDK
      run: |
        mkdir -p $HOME/theos/sdks
        curl -L -o /tmp/iPhoneOS6.1.sdk.tar.gz "https://github.com/growtopiajaw/iPhoneOS-SDK/raw/master/iPhoneOS6.1.sdk.tar.gz"
        tar -xzf /tmp/iPhoneOS6.1.sdk.tar.gz -C $HOME/theos/sdks/
        ls $HOME/theos/sdks/
        
    - name: Build WazeOSM
      working-directory: waze-osm-native
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package FINALPACKAGE=1
        ls -la packages/
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: WazeOSM.ipa
        path: waze-osm-native/packages/*.ipa
        
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: WazeOSM v${{ github.run_number }}
        body: "WazeOSM - Native iOS 6 app with OpenStreetMap. No server dependency. Just install and use."
        files: waze-osm-native/packages/*.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
